name: Temporary format inspection
on:
  pull_request:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Print formatted changed files for review
        run: |
          npx prettier --write components/auth.tsx components/join.tsx lib/auth-flow.ts tests/auth-flow.test.ts tests/e2e/auth.spec.ts
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          for (const path of [
            'components/auth.tsx',
            'components/join.tsx',
            'lib/auth-flow.ts',
            'tests/auth-flow.test.ts',
            'tests/e2e/auth.spec.ts',
          ]) {
            console.log('@@FORMATTED@@' + path + '@@' + JSON.stringify(readFileSync(path, 'utf8')));
          }
          NODE
