name: Temporary changed-file formatting inspection
on:
  pull_request:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Print Prettier-formatted files for review
        run: |
          npx prettier --write 'README.md' 'app/api/[...path]/route.ts' 'app/display/[id]/page.tsx' 'app/globals.css' 'components/auth.tsx' 'components/display-access.tsx' 'components/join.tsx' 'components/recovery-code.tsx' 'components/recovery-join.tsx' 'components/recovery-requests.tsx' 'components/session.tsx' 'components/use-session.ts' 'docs/scaling-runtime.md' 'lib/auth-flow.ts' 'lib/server/guest-access.ts' 'tests/auth-flow.test.ts' 'tests/e2e/auth.spec.ts' 'tests/e2e/display-public.spec.ts' 'tests/guest-access.test.ts' 'tests/recovery-database.test.ts'
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const files = ["README.md","app/api/[...path]/route.ts","app/display/[id]/page.tsx","app/globals.css","components/auth.tsx","components/display-access.tsx","components/join.tsx","components/recovery-code.tsx","components/recovery-join.tsx","components/recovery-requests.tsx","components/session.tsx","components/use-session.ts","docs/scaling-runtime.md","lib/auth-flow.ts","lib/server/guest-access.ts","tests/auth-flow.test.ts","tests/e2e/auth.spec.ts","tests/e2e/display-public.spec.ts","tests/guest-access.test.ts","tests/recovery-database.test.ts"];
          for (const path of files) {
            console.log('@@FORMATTED@@' + path + '@@' + JSON.stringify(readFileSync(path, 'utf8')));
          }
          NODE
