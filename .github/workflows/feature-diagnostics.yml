name: Temporary diagnostics for feature branch
on:
  pull_request:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Inspect API Prettier output and test formatting
        run: |
          npx prettier --write 'app/api/[...path]/route.ts'
          git diff -- 'app/api/[...path]/route.ts' || true
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const path='app/api/[...path]/route.ts';
          console.log('@@FORMATTED@@'+path+'@@'+JSON.stringify(readFileSync(path,'utf8')));
          NODE
      - name: Check typing
        run: npm run typecheck
      - name: Run unit tests
        run: npm test
      - name: Build
        run: npm run build
