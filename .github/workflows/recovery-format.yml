name: Temporary recovery test formatting
on:
  pull_request:
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          npx prettier --write tests/recovery-database.test.ts
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const path='tests/recovery-database.test.ts';
          console.log('@@FORMATTED@@'+path+'@@'+JSON.stringify(readFileSync(path,'utf8')));
          NODE
