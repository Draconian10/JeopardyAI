name: Temporary formatting inspection
on:
  pull_request:
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Print canonical test formatting
        run: |
          npx prettier --write 'tests/e2e/auth.spec.ts' 'tests/e2e/game.spec.ts' 'tests/e2e/player-recovery-flow.spec.ts'
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          for (const path of ["tests/e2e/auth.spec.ts","tests/e2e/game.spec.ts","tests/e2e/player-recovery-flow.spec.ts"])
            console.log('@@FORMATTED@@'+path+'@@'+JSON.stringify(readFileSync(path,'utf8')));
          NODE
